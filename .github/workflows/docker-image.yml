name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: docker build . --file Dockerfile.dev --tag yukochu/docker-react:$(date +%s)
    # - run: docker run -e CI=true yukochu/docker-react:$(date +%s) npm test
