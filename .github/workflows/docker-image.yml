name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps: # Ensure this is indented correctly under "build"
      - uses: actions/checkout@v4
      # - run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - run: docker build . --file Dockerfile.dev --tag yukochu/docker-react:latest
      - run: docker run -e CI=true yukochu/docker-react:latest npm test
